services:
  - type: web
    name: lootbox-role-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: DATA_SYNC_ENABLED
        value: "true"
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: "HuyHoagnn/LootBoxRoleBot"
